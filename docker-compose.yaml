version: '3.8'

services:
  web:
    build: .
    container_name: rule4local
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      # These are read from the .env file, but we can list them
      # explicitly if we want to be clear about what the app needs.
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=rule4be.settings
      - DATABASE_URL # This variable is passed through from the .env file
    depends_on:
      - db

  db:
    image: postgres:17
    restart: always
    environment:
      # --- CHANGED: Now reading from variables ---
      # Docker Compose will replace ${...} with values from the .env file
      - POSTGRES_DB=${LOCAL_DB_NAME}
      - POSTGRES_USER=${LOCAL_DB_USER}
      - POSTGRES_PASSWORD=${LOCAL_DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Note: We don't expose the db port to the host anymore.
    # The 'web' service can reach it directly over the internal Docker network.
    # You can add the ports section back if you want to connect with a local psql client.
    ports:
     - "5433:5432"

volumes:
  pgdata: {}